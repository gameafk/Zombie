<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>فرار از زامبی‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ctl:0px;--p:#a855f7;--pl:#d8b4fe;--u:44px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0f0d16;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Vazirmatn,Tahoma,sans-serif}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc((100vh - var(--ctl))*800/560));width:min(100vw,calc((100dvh - var(--ctl))*800/560));aspect-ratio:800/560}
canvas{width:100%;height:100%;display:block;position:absolute;left:0;top:0}
#c{background:#17141f}#c3,#ch{background:none;pointer-events:none}
#ctl{display:flex;direction:ltr;position:fixed;left:0;right:0;bottom:0;padding:8px 18px max(6px,env(safe-area-inset-bottom));justify-content:space-between;align-items:flex-end;pointer-events:none;visibility:hidden}
#ctl .b,#joy{pointer-events:auto}
@media (pointer:coarse) and (orientation:portrait){:root{--u:min(54px,calc((100vw - 46px)/6.6));--ctl:calc(var(--u)*3 + 40px)}#ctl{position:static;height:var(--ctl);align-items:center;background:#1a1626;border-top:2px solid #3b2a5c;padding:8px 14px}}
#joy{position:relative;width:calc(var(--u)*3 + 8px);height:calc(var(--u)*3 + 8px);border-radius:50%;border:2px solid var(--p);background:rgba(168,85,247,.12);touch-action:none}
#knob{position:absolute;width:42%;height:42%;left:29%;top:29%;border-radius:50%;background:rgba(168,85,247,.6);border:2px solid #f0abfc;pointer-events:none}
#ac{display:grid;grid-template:repeat(3,var(--u))/calc(var(--u)*1.33) calc(var(--u)*2.07);gap:6px}
.b{border:2px solid var(--p);background:rgba(40,24,72,.55);color:var(--pl);border-radius:14px;font:800 15px Vazirmatn,Tahoma,sans-serif;touch-action:none;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.b.on{background:rgba(168,85,247,.65);color:#fff;transform:scale(.93)}
#fire{grid-column:2;grid-row:1/3;border-radius:30px;font-size:22px;background:rgba(232,121,249,.2);border-color:#e879f9}
#pw{grid-column:2;grid-row:3;border-color:#fbbf24;color:#fde68a;background:rgba(251,191,36,.18)}
</style>
</head>
<body>
<div id="app">
<div id="stage"><canvas id="c"></canvas><canvas id="c3"></canvas><canvas id="ch"></canvas></div>
<div id="ctl">
 <div id="joy"><div id="knob"></div></div>
 <div id="ac">
  <button class="b" data-k="ShiftLeft">دویدن</button>
  <button class="b" data-k="KeyR">خشاب</button>
  <button class="b" data-k="KeyE">ماشین</button>
  <button class="b" id="fire" data-k="KeyJ">شلیک</button>
  <button class="b" id="pw" data-k="KeyQ">قدرت</button>
 </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const cv=document.getElementById('c'),cH=document.getElementById('ch'),cx0=cv.getContext('2d'),cx1=cH.getContext('2d'),VW=800,VH=560,WW=2220,WH=1500,RS=Math.min(window.devicePixelRatio||1,2);
let ctx=cx0;
cv.width=cH.width=VW*RS;cv.height=cH.height=VH*RS;
const XS=[],YS=[];for(let i=0;i<=12;i++)XS.push(30+i*180);for(let i=0;i<=8;i++)YS.push(30+i*180);
const WEAPONS=[{n:'تپانچه',mag:12,res:72,rate:.28,dmg:1.6,pel:1,spr:.04,rl:1.1},{n:'مسلسل',mag:30,res:180,rate:.09,dmg:1,pel:1,spr:.1,rl:1.5},{n:'شاتگان',mag:6,res:36,rate:.8,dmg:1.2,pel:6,spr:.35,rl:1.8}];
const CARS=[{n:'پراید',hp:100,sp:340,c:'#eeeeef',r:15},{n:'پژو پارس',hp:160,sp:320,c:'#a9adb6',r:16},{n:'ولوو تریلی',hp:260,sp:290,c:'#1e3a52',r:20}];
const HEROES=[
{n:'رشتی',hp:130,sp:1.05,am:1.2,c:'#1f7aa8',sw:'#1f7aa8',hair:'#5a5a64',pants:'#2a2e45',skin:'#d6a67e',hs:'rec',must:1,pk:'rash',pn:'باقالا قاتوق با کله‌ماهی',pd:['جانش کامل پر می‌شه','و سقف جانش بیشتر می‌شه']},
{n:'مهدی گلنار',hp:120,sp:1.1,am:1.1,c:'#ef4444',sw:'#c81e2d',hair:'#08080a',pants:'#101016',skin:'#d9a87c',hs:'short',sport:1,pk:'mehdi',pn:'صابون',pd:['روی صابون سر می‌خوره','سرعتش ۶ ثانیه خیلی زیاد می‌شه']},
{n:'جوزف',hp:110,sp:1,am:1,c:'#f5f5f5',sw:'#0b0b0e',hair:'#0b0b0e',pants:'#0b0b0e',skin:'#fffdfd',hs:'short',pk:'joseph',pn:'نور سفید',pd:['نور خیلی سفید از پوست بدنش می‌تابه','زامبی‌های نزدیکش نابود می‌شن']}];
const ZT=[{n:'عادی',hp:3,sp:58,r:11,c:'#4ade80'},{n:'تیزپا',hp:2,sp:100,r:10,c:'#ff3b3b'},{n:'غول',hp:9,sp:42,r:16,c:'#a855f7'}];
const ZCL=['#2e6fbf','#f59e0b','#d946ef'],ZPN=['#1f3a5f','#7c2d12','#4a1d6b'],ZLEAN=[-.1,-.34,-.06];
const DIFFS=['آسان','متوسط','سخت','خیلی سخت'],CNT=[.7,1,1.4,2],SPD=[.85,1,1.15,1.3],DMG=[.7,1,1.4,1.9];
const STAT={wep:i=>`خشاب ${WEAPONS[i].mag}  |  فشنگ ${WEAPONS[i].res}  |  شلیک ${WEAPONS[i].pel>1?'ساچمه‌ای':Math.round(1/WEAPONS[i].rate)+'/ث'}`,car:i=>`سلامت ${CARS[i].hp}  |  سرعت ${CARS[i].sp}`,hero:i=>`جان ${HEROES[i].hp}  |  سرعت ×${HEROES[i].sp}  |  فشنگ ×${HEROES[i].am}`,zomb:i=>`جان ${ZT[i].hp}  |  سرعت ${ZT[i].sp}`};
const SCR=[
 {t:'',rows:[{k:'lives',l:'تعداد جان',o:['1','2','3','4','5']},{k:'diff',l:'حالت سختی',o:DIFFS}]},
 {t:'انتخاب تجهیزات',rows:[{k:'wep',l:'اسلحه',o:WEAPONS.map(x=>x.n),pv:'wep'},{k:'car',l:'ماشین',o:CARS.map(x=>x.n),pv:'car'}]},
 {t:'انتخاب شخصیت‌ها',rows:[{k:'hero',l:'قهرمان تو',o:HEROES.map(x=>x.n),pv:'hero'},{k:'zt',l:'زامبی تعقیب‌کننده',o:ZT.map(x=>x.n),pv:'zomb'}]}
];
const cfg={lives:2,diff:1,wep:0,car:0,hero:0,zt:0};
let jFl=0,lastS='';const PCD=60,joy={x:0,y:0},CTL=document.getElementById('ctl');
let state='menu',sc=0,mr=0,trans=1,level=1,score=0,dScore=0,kills=0,lives=3,hi=0,t=0,overAt=0,levelTime=0,msg='',msgT=0,shake=0,flash=0,invul=0,fcd=0,mz=0,ey=0;
let blocks=[],parks=[],lamps=[],zs=[],items=[],bul=[],parts=[],decals=[],skids=[],corpses=[],floats=[],P,car,nCans=0,cam={x:0,y:0},mouse={x:0,y:0},mouseOn=false,ui=[];
let banner={s:'',t:0},fade=0,ltT=6,ltF=0,stepT=0,skT=0,exT=0,rain=[];
const keys={};
let paused=false,ldt=.016,shx=0,shy=0,pv3=[],T3=!!window.THREE,NB;
try{hi=+localStorage.getItem('zombie-hi2')||0}catch(e){}
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function saveHi(){if(score>hi){hi=score;try{localStorage.setItem('zombie-hi2',hi)}catch(e){}}}
for(let i=0;i<110;i++)rain.push({x:rand(0,VW),y:rand(0,VH),v:rand(520,820),l:rand(9,16)});
const ASPH=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#1d1a27';g.fillRect(0,0,256,256);
 for(let i=0;i<900;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.18)';g.fillRect(Math.random()*256,Math.random()*256,rand(1,3),rand(1,3))}
 g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;for(let i=0;i<5;i++){g.beginPath();let x=rand(0,256),y=rand(0,256);g.moveTo(x,y);for(let j=0;j<4;j++){x+=rand(-20,20);y+=rand(-20,20);g.lineTo(x,y)}g.stroke()}
 return cx0.createPattern(c,'repeat')})();
const GRASS=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#1f2f2a';g.fillRect(0,0,128,128);for(let i=0;i<300;i++){g.fillStyle=Math.random()<.5?'rgba(120,200,140,.07)':'rgba(0,0,0,.18)';g.fillRect(Math.random()*128,Math.random()*128,1.5,rand(2,5))}return cx0.createPattern(c,'repeat')})();

/* ---------- audio ---------- */
let AC;
function getAC(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function beep(f,d=.08,ty='square',v=.04){try{const A=getAC(),o=A.createOscillator(),g=A.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.stop(A.currentTime+d)}catch(e){}}
const say=(s,d=2.2)=>{msg=s;msgT=d};
function shot(i){try{const A=getAC();if(!NB){NB=A.createBuffer(1,A.sampleRate*.4,A.sampleRate);const d=NB.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1}
const o=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain(),du=[.12,.09,.3][i],n=A.currentTime;o.buffer=NB;f.type='lowpass';f.frequency.value=[2500,3200,1400][i];g.gain.setValueAtTime([.25,.2,.45][i],n);g.gain.exponentialRampToValueAtTime(.001,n+du);o.connect(f);f.connect(g);g.connect(A.destination);o.start();o.stop(n+du)}catch(e){}}
function thunder(){if(!AC)return;try{const A=getAC();if(!NB){NB=A.createBuffer(1,A.sampleRate*.4,A.sampleRate);const d=NB.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1}
const o=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain(),n=A.currentTime;o.buffer=NB;o.loop=true;f.type='lowpass';f.frequency.value=220;g.gain.setValueAtTime(.001,n);g.gain.linearRampToValueAtTime(.22,n+.15);g.gain.exponentialRampToValueAtTime(.001,n+1.6);o.connect(f);f.connect(g);g.connect(A.destination);o.start();o.stop(n+1.7)}catch(e){}}

/* ---------- particles ---------- */
function burst(x,y,c,n,sp=200,s=3){for(let i=0;i<n;i++){const a=rand(0,6.28),v=rand(30,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rand(.3,.7),ml:.7,c,s})}}
function sparks(x,y,n,c='#ffd27a'){for(let i=0;i<n;i++){const a=rand(0,6.28),v=rand(80,260);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rand(.15,.4),ml:.4,c,s:2,line:1})}}
function ring(x,y,c,r=6,g2=26,l=.45){parts.push({x,y,vx:0,vy:0,l,ml:l,c,s:r,g2,ring:1})}
function smoke(x,y,c='#6b6480'){parts.push({x,y,vx:rand(-12,12),vy:rand(-12,12),l:1,ml:1,c,s:5,g:16})}
function dust(x,y){parts.push({x,y,vx:rand(-14,14),vy:rand(-14,14),l:.45,ml:.45,c:'#8a8398',s:3,g:10})}
function fl(x,y,s,c='#fff'){floats.push({x,y,s,c,l:1})}

/* ---------- collision ---------- */
function hitB(e){for(const b of blocks){const cx=clamp(e.x,b.x,b.x+b.w),cy=clamp(e.y,b.y,b.y+b.h);if((e.x-cx)**2+(e.y-cy)**2<e.r*e.r)return true}return false}
function moveXY(e,dx,dy){let f=0,o=e.x;e.x=clamp(o+dx,e.r,WW-e.r);if(hitB(e)){e.x=o;f|=1}o=e.y;e.y=clamp(o+dy,e.r,WH-e.r);if(hitB(e)){e.y=o;f|=2}return f}
function move(e,dx,dy){return moveXY(e,dx,dy)!==0}

/* ---------- 2D fallback entity drawing ---------- */
function drawGun(x,y,a,i,s=1){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(s,s);ctx.fillStyle='#9a98b0';
  if(i==0){ctx.fillRect(0,-2.5,16,5);ctx.fillStyle='#4b4560';ctx.fillRect(1,0,5,6)}
  else if(i==1){ctx.fillRect(-4,-3,28,6);ctx.fillStyle='#4b4560';ctx.fillRect(4,0,5,9);ctx.fillRect(12,-6,4,3)}
  else{ctx.fillRect(-6,-2.5,38,5);ctx.fillStyle='#7a5a3a';ctx.fillRect(-14,-3.5,10,7);ctx.fillStyle='#4b4560';ctx.fillRect(10,-4.5,10,2)}
  ctx.restore();
}
function drawHero(x,y,a,h,w,s=1,gun=-1){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(s,s);
  const sw=Math.sin(w)*4;
  ctx.fillStyle='#2d2640';ctx.beginPath();ctx.arc(sw,-6,4,0,6.28);ctx.arc(-sw,6,4,0,6.28);ctx.fill();
  ctx.fillStyle=HEROES[h].c;ctx.beginPath();ctx.arc(0,0,10,0,6.28);ctx.fill();
  ctx.fillStyle='#00000040';ctx.beginPath();ctx.arc(9,-5,3.5,0,6.28);ctx.arc(9,5,3.5,0,6.28);ctx.fill();
  if(gun>=0)drawGun(8,0,0,gun,.85);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(1,0,5,0,6.28);ctx.fill();
  ctx.restore();
}
function drawZomb(x,y,a,k,w,f,s=1,pale){
  const Z=ZT[k];ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.sin(w*.5)*.12);ctx.scale(s,s);
  ctx.fillStyle=f>0?'#fff':pale?'#f1f1f5':Z.c;ctx.beginPath();ctx.arc(0,0,Z.r,0,6.28);ctx.fill();
  for(const q of[-1,1]){const l=Z.r+4+Math.sin(w+q)*3;ctx.fillRect(Z.r-3,q*(Z.r*.55)-2,l-Z.r+6,4)}
  ctx.fillStyle='#ff2d55';ctx.beginPath();ctx.arc(Z.r*.45,-Z.r*.35,2.3,0,6.28);ctx.arc(Z.r*.45,Z.r*.35,2.3,0,6.28);ctx.fill();
  ctx.restore();
}
function drawCar(x,y,a,i,dead,lights,s=1){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(s,s);
  if(lights&&!dead){ctx.fillStyle='rgba(255,240,200,.13)';ctx.beginPath();ctx.moveTo(16,-6);ctx.lineTo(130,-46);ctx.lineTo(130,46);ctx.lineTo(16,6);ctx.fill()}
  const L=[16,19,32][i];
  ctx.fillStyle=dead?'#3a3745':CARS[i].c;ctx.fillRect(-L,-9.5,L*2,19);
  ctx.fillStyle=dead?'#25222e':'#1b1626';ctx.fillRect(L-16,-7.5,9,15);ctx.fillRect(-L+6,-7.5,6,15);
  ctx.fillStyle='#fff7d6';ctx.fillRect(L-2,-8,3,4);ctx.fillRect(L-2,4,3,4);
  ctx.fillStyle='#ff4d6d';ctx.fillRect(-L-1,-8,2,4);ctx.fillRect(-L-1,4,2,4);
  ctx.restore();
}

/* ---------- level ---------- */
function genLevel(){
  blocks=[];parks=[];lamps=[];bul=[];parts=[];decals=[];skids=[];corpses=[];floats=[];
  const cols=['#2b2738','#342d48','#3a3350','#2f2c3b','#403a56'];
  for(let gx=0;gx<12;gx++)for(let gy=0;gy<8;gy++){
    const x=60+gx*180,y=60+gy*180,r=Math.random();
    if(r<.12)parks.push({x,y,w:120,h:120});
    else{const hh=rand(14,40),ci=Math.floor(rand(0,5));blocks.push({x,y,w:120,h:120,hh,h3:14+hh*.9,c:cols[ci],ci,vi:Math.floor(rand(0,3)),s:Math.floor(rand(0,99))})}
  }
  const cand=blocks.filter(b=>b.x>200).sort(()=>Math.random()-.5);
  ['school','hosp','mosque','azadi','bazaar','nan','kebab','pharm'].forEach((k,i)=>{if(cand[i])cand[i].kind=k});
  for(let i=0;i<=12;i++)for(let j=0;j<=8;j++)if((i+j)%2==0&&i>0&&j>0&&i<12&&j<8)lamps.push({x:XS[i]-27,y:YS[j]-27});
  ey=pick(YS);
  P.x=30;P.y=pick(YS);P.inCar=false;
  car={x:210,y:P.y,r:CARS[cfg.car].r,a:0,v:0,hp:CARS[cfg.car].hp,mhp:CARS[cfg.car].hp,dead:false,turn:0,acc:0,cc:0,pitch:0,roll:0,steer:0};
  const all=[];XS.forEach(x=>YS.forEach(y=>all.push({x,y})));
  const far=all.filter(p=>dist(p,P)>450).sort(()=>Math.random()-.5);
  nCans=Math.min(4+level,8);
  items=[];
  far.splice(0,nCans).forEach(p=>items.push({x:p.x,y:p.y,k:'can'}));
  far.splice(0,4).forEach(p=>items.push({x:p.x,y:p.y,k:'ammo'}));
  far.splice(0,3).forEach(p=>items.push({x:p.x,y:p.y,k:'med'}));
  zs=[];
  const n=Math.min(Math.round((14+level*5)*CNT[cfg.diff]),cfg.diff===3?110:70),spawn=all.filter(p=>dist(p,P)>550);
  for(let i=0;i<n;i++){
    const p=pick(spawn),k=cfg.diff===3?Math.floor(Math.random()*3):level>=3&&Math.random()<.2?(cfg.zt+1+Math.floor(Math.random()*2))%3:cfg.zt,Z=ZT[k];
    zs.push({x:p.x+rand(-10,10),y:p.y+rand(-10,10),t:k,hp:Z.hp*(1+level*.05),r:Z.r,sp:Z.sp*SPD[cfg.diff]*(1+Math.min(level,8)*.04)*rand(.9,1.1),wx:p.x,wy:p.y,wt:0,lt:rand(0,.3),los:true,nt:null,stuck:0,detour:0,da:0,a:0,w:rand(0,6),cd:0,fl:0});
  }
  levelTime=0;cam.x=clamp(P.x-VW/2,0,WW-VW);cam.y=clamp(P.y-VH/2,0,WH-VH);
  fade=1;banner={s:'مرحله '+level,t:2.4};
  if(T3)try{build3D()}catch(e){}
}
function startGame(){
  if(state==='over'&&performance.now()-overAt<800)return;
  const W=WEAPONS[cfg.wep],H=HEROES[cfg.hero];
  paused=false;level=1;score=0;dScore=0;kills=0;lives=cfg.lives+1;
  P={x:30,y:30,r:10,hp:H.hp,mhp:H.hp,stam:100,tired:false,run:false,fa:0,w:0,inCar:false,mag:W.mag,res:Math.round(W.res*H.am),rl:0,pc:25,pa:0,ph:0,hid:false,slA:0};jFl=0;
  genLevel();invul=2;state='play';say('بنزین‌ها را پیدا کن و از شهر فرار کن!',3);beep(440,.1);
}
function toMenu(){state='menu';paused=false;keys.Mouse=false;go(0)}
function gameOver(){state='over';overAt=performance.now();saveHi()}

function los(a,b){const n=Math.ceil(dist(a,b)/16);for(let i=1;i<n;i++){const x=a.x+(b.x-a.x)*i/n,y=a.y+(b.y-a.y)*i/n;for(const k of blocks)if(x>k.x-8&&x<k.x+k.w+8&&y>k.y-8&&y<k.y+k.h+8)return false}return true}
function nextNode(z){
  if(z.nt&&Math.hypot(z.nt.x-z.x,z.nt.y-z.y)>14)return z.nt;
  const ni=clamp(Math.round((z.x-30)/180),0,12),nj=clamp(Math.round((z.y-30)/180),0,8),pi=clamp(Math.round((P.x-30)/180),0,12),pj=clamp(Math.round((P.y-30)/180),0,8);
  let a=ni,b=nj;
  if(z.nt){const di=pi-ni,dj=pj-nj;if(di||dj){if(Math.abs(di)>=Math.abs(dj)&&di)a+=Math.sign(di);else b+=Math.sign(dj)}}
  z.nt={x:XS[a],y:YS[b]};return z.nt;
}
function killZ(z,ix=0,iy=0,spin=0){
  z.dead=true;kills++;const s=30*(1+z.t);score+=s;fl(z.x,z.y-10,'+'+s,'#d8b4fe');

/* ---------- drawing helpers ---------- */

function bar(x,y,w,h,v,c,bg='#0007'){ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);ctx.fillStyle=c;ctx.fillRect(x,y,w*clamp(v,0,1),h);ctx.strokeStyle='#ffffff30';ctx.strokeRect(x,y,w,h)}
function vis(o,w=60){return o.x>cam.x-w&&o.x<cam.x+VW+w&&o.y>cam.y-w&&o.y<cam.y+VH+w}
function glow(x,y,r,c0,c1='rgba(0,0,0,0)'){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}

/* ---------- world (ground layer) ---------- */
function drawWorld(){
  const camx=Math.round(cam.x),camy=Math.round(cam.y);
  ctx.save();
  ctx.translate(shx,shy);
  ctx.translate(-camx,-camy);
  ctx.fillStyle=ASPH;ctx.fillRect(camx-20,camy-20,VW+40,VH+40);
  // lane markings (aligned to world, no sliding)
  ctx.strokeStyle='rgba(255,214,140,.16)';ctx.lineWidth=2;ctx.setLineDash([14,16]);
  ctx.lineDashOffset=camy%30;ctx.beginPath();XS.forEach(x=>{if(x>camx-5&&x<camx+VW+5){ctx.moveTo(x,camy-20);ctx.lineTo(x,camy+VH+20)}});ctx.stroke();
  ctx.lineDashOffset=camx%30;ctx.beginPath();YS.forEach(y=>{if(y>camy-5&&y<camy+VH+5){ctx.moveTo(camx-20,y);ctx.lineTo(camx+VW+20,y)}});ctx.stroke();
  ctx.setLineDash([]);ctx.lineDashOffset=0;
  // crosswalks
  ctx.fillStyle='rgba(235,230,250,.13)';
  for(const x of XS){if(x<camx-60||x>camx+VW+60)continue;for(const y of YS){if(y<camy-60||y>camy+VH+60)continue;
    for(let i=0;i<6;i++){const o=-25+i*10;ctx.fillRect(x+34,y+o,9,5);ctx.fillRect(x-43,y+o,9,5);ctx.fillRect(x+o,y+34,5,9);ctx.fillRect(x+o,y-43,5,9)}}}
  // parks
  for(const p of parks){if(!vis({x:p.x+60,y:p.y+60},120))continue;ctx.fillStyle='#2b2838';ctx.fillRect(p.x-6,p.y-6,p.w+12,p.h+12);ctx.fillStyle=GRASS;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeStyle='#3a4a52';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x+10,p.y+p.h-10);ctx.quadraticCurveTo(p.x+p.w/2,p.y+p.h/2,p.x+p.w-10,p.y+10);ctx.stroke()}
  // skids & decals
  for(const s of skids){ctx.globalAlpha=Math.min(.55,s.l*.14);ctx.fillStyle='#050408';ctx.beginPath();ctx.arc(s.x,s.y,2.4,0,6.28);ctx.fill()}
  for(const d of decals){ctx.globalAlpha=Math.min(.55,d.l*.1);ctx.fillStyle='#8f0f33';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.28);ctx.fill();if(d.sp)for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(d.x+d.sp[0]*(i+1)*.8,d.y+d.sp[1]*(i-.5)*.9,d.sp[2]*(1-i*.2),0,6.28);ctx.fill()}}
  ctx.globalAlpha=1;
  // blocks (footprints in 3D mode, full drawing in fallback)
  for(const b of blocks){
    if(!vis({x:b.x+60,y:b.y+60},120))continue;
    ctx.fillStyle='#2b2838';ctx.fillRect(b.x-7,b.y-7,b.w+14,b.h+14);
    ctx.strokeStyle='#3d3752';ctx.lineWidth=2;ctx.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12);
    if(!T3){

function walkPose(h,ph,amp){h.userData.legs[0].rotation.z=Math.sin(ph)*.75*amp;h.userData.legs[1].rotation.z=-Math.sin(ph)*.75*amp}
function render3D(){
  if(!T3)return;
  hero3.forEach(o=>o.visible=false);car3.forEach(o=>o.visible=false);gunP.forEach(o=>o.visible=false);plight.intensity=0;zidx[0]=zidx[1]=zidx[2]=0;
  hemi.intensity=.95+ltF*.9;
  let cx,cz;
  if(state==='menu'){
    cx=VW/2;cz=VH/2;R3.domElement.style.opacity=clamp(1-trans*1.3,0,1);
    W3.visible=false;if(gnd)gnd.visible=false;
    for(const p of pv3){
      if(p.k==='hero'){const h=hero3[p.i];h.visible=true;h.position.set(p.x,0,p.y+30);h.scale.setScalar(3.2);h.rotation.y=-t*.9;h.rotation.z=0;walkPose(h,t*4,.7);h.userData.armQ.forEach(q=>q.rotation.z=1.35);h.userData.guns.forEach((g,j)=>{g.visible=j===cfg.wep;g.userData.fl.visible=false})}
      else if(p.k==='car'){const c=car3[p.i];c.visible=true;c.position.set(p.x,0,p.y+22);c.scale.setScalar(2.3);c.rotation.y=-t*.9;c.rotation.x=0;c.rotation.z=0;c.userData.wh.forEach(w=>{w.rotation.z=-t*8;w.rotation.y=0});c.userData.body.color.copy(c.userData.base)}
      else if(p.k==='zomb'){const m=getZM(p.i);poseZ(m,p.i,p.x,p.y+30,t*.9,t*5,0,0,3.1*11/ZT[p.i].r*ZT[p.i].r/11*(p.i==2?.8:1),0,1)}
      else{const g=gunP[p.i];g.visible=true;g.position.set(p.x,20,p.y+10);g.scale.setScalar(5.5);g.rotation.y=-t*.8}
    }
  }else{
    W3.visible=true;if(gnd)gnd.visible=true;
    cx=Math.round(cam.x)+VW/2-shx;cz=Math.round(cam.y)+VH/2-shy;
    R3.domElement.style.opacity=1;
    const H=hero3[cfg.hero],u=H.userData,W=WEAPONS[cfg.wep],gr=u.gun;
    const spd=Math.min(1,Math.abs(P.w-u.lw)*5);u.lw=P.w;
    H.visible=!P.inCar&&!P.hid&&!(invul>0&&Math.floor(t*14)%2);
    H.position.set(P.x,Math.abs(Math.sin(P.w*.55))*spd*(P.run?1.8:1),P.y);H.rotation.y=-P.fa;
    u.lean+=((P.run?-.2:-.05*spd)-u.lean)*Math.min(1,ldt*10);H.rotation.z=u.lean;
    H.scale.set(1.05,1.05+Math.sin(t*2.2)*.012*(1-spd),1.05);
    walkPose(H,P.w*.55,spd*(P.run?1.35:1));
    u.head.rotation.z=Math.sin(P.w*1.1)*.05*spd;u.head.rotation.y=Math.sin(t*.8)*.05*(1-spd);
    u.armQ.forEach((q,i)=>{q.rotation.z=1.35+(mz>0?.16:0)+Math.sin(P.w*.55+i*3.14)*.05*spd});
    u.swm.emissive.setRGB(Math.max(flash*1.6,Math.min(1,jFl)*.9),Math.min(1,jFl)*.9,Math.min(1,jFl)*.9);u.sk.emissive.setScalar(Math.min(1,jFl)*.8);
    u.guns.forEach((g,j)=>{g.visible=j===cfg.wep;g.userData.fl.visible=j===cfg.wep&&mz>0});
    gr.position.x=8-(mz>0?mz/.06*1.8:0);gr.rotation.z=P.rl>0?-Math.sin((1-P.rl/W.rl)*Math.PI)*.8:(mz>0?.12:0);
    if(mz>0){const v=new THREE.Vector3();u.guns[cfg.wep].userData.fl.getWorldPosition(v);plight.position.copy(v);plight.intensity=2.4}
    const C=car3[cfg.car],hf=car.hp/car.mhp,cu=C.userData;
    C.visible=true;C.position.set(car.x,0,car.y);C.rotation.y=-car.a;C.scale.setScalar(.85);
    car.pitch+=(clamp(car.acc*.00016,-.06,.06)-car.pitch)*Math.min(1,ldt*8);
    car.roll+=(clamp(car.turn*car.v*.00009,-.07,.07)-car.roll)*Math.min(1,ldt*8);
    car.steer+=(clamp(car.turn*.12,-.5,.5)-car.steer)*Math.min(1,ldt*12);
    C.rotation.z=car.pitch;C.rotation.x=car.roll;C.position.y=P.inCar?Math.abs(Math.sin(t*38))*.25*Math.min(1,Math.abs(car.v)/200):0;
    if(!paused)cu.wh.forEach(w=>w.rotation.z-=car.v*ldt/4.4);
    cu.wh[0].rotation.y=cu.wh[1].rotation.y=-car.steer;
    cu.body.color.copy(cu.base).lerp(DARK,car.dead?.85:(1-hf)*.6);
    // zombies & corpses
    for(const z of zs){if(vis(z,70))poseZ(getZM(z.t),z.t,z.x,z.y,z.a,z.w,z.fl,0,z.r/11,0)}
    for(const c of corpses){if(vis(c,70))poseZ(getZM(c.t),c.t,c.x,c.y,c.a,c.w,0,Math.min(1,c.age/.35),c.sc,Math.max(0,c.age-4.2)*20,Math.min(1,c.age*5))}
    // items
    for(const it of items)if(it.m){it.m.position.set(it.x,10+Math.sin(t*3+it.x)*2.6,it.y);it.m.rotation.y=t*1.8+it.x;const s=1.15+Math.sin(t*5+it.y)*.04;it.m.scale.setScalar(s)}
    // trees sway, beacon & gate
    for(const o of W3.children)if(o.userData.sw!==undefined)o.rotation.z=Math.sin(t*1.4+o.userData.sw)*.025;
    BEACON.color.setHex(Math.sin(t*4)>0?0xff2244:0x4a0814);
    const open=!items.some(q=>q.k==='can');GATEM.color.setHex(open?(Math.sin(t*8)>0?0xf0abfc:0xc084fc):0xff4d6d);
    if(gnd){gnd.position.x=cx;gnd.position.z=cz}
  }
  for(let k=0;k<3;k++)for(let j=zidx[k];j<zpool[k].length;j++)zpool[k][j].visible=false;
  if(dl){dl.position.set(cx-200,400,cz+150);dl.target.position.set(cx,0,cz)}
  cam3.position.set(cx,D3*Math.cos(TILT),cz+D3*Math.sin(TILT));cam3.lookAt(cx,0,cz);R3.render(sc3,cam3);
}
try{if(T3)initThree()}catch(e){T3=false;document.getElementById('c3').style.display='none'}

let last=performance.now();
function loop(n){
  const dt=Math.min(.033,(n-last)/1000);last=n;t+=dt;trans=Math.max(0,trans-dt*4);
  ldt=dt;
  ltT-=dt;if(ltT<=0){ltF=1;ltT=rand(8,20);setTimeout(thunder,rand(250,900))}ltF=Math.max(0,ltF-dt*2.2);
  dScore+=(score-dScore)*Math.min(1,dt*7);
  if(state==='play'&&!paused)upd(dt);
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
